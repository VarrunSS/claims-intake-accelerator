name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so a clean build is part of the check.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Line coverage by test project"
            for f in $(find TestResults -name 'coverage.cobertura.xml' | sort); do
              rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$f" | cut -d'"' -f2)
              echo "- $(awk -v r="$rate" 'BEGIN { printf "%.1f%%", r * 100 }') ($f)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  # Milestone 4 adds the evaluation job. It scores the extraction agent against the synthetic claims in
