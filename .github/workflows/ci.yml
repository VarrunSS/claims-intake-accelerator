name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so a clean build is part of the check.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Line coverage by test project"
            for f in $(find TestResults -name 'coverage.cobertura.xml' | sort); do
              rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$f" | cut -d'"' -f2)
              echo "- $(awk -v r="$rate" 'BEGIN { printf "%.1f%%", r * 100 }') ($f)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  # The Angular review UI. Its tests run in jsdom, so no browser is needed.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  # The evaluation gate (Milestone 4). It runs the held-out test split of evals/dataset through the local pipeline (heuristic
  # extractor, rules assessor), in process, with no credentials, so it also runs on pull requests from forks. It fails the
  # build when a metric falls below evals/thresholds.json. Real-model evaluation arrives in Milestone 5.
  evals:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run the evaluation on the test split
        id: eval
        run: |
          set +e
          dotnet run -c Release --project evals/ClaimsIntake.Evals -- --split test --run-id ci --out eval-results --thresholds evals/thresholds.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write the report to the job summary
        if: always()
        run: |
          if [ -f eval-results/ci/report.md ]; then
            cat eval-results/ci/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The evaluation did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-results/ci/report.md
            eval-results/ci/results.json
          if-no-files-found: warn

      # The run above never fails the step itself, so the report is always written and uploaded first.
      - name: Fail the build below threshold
        if: steps.eval.outputs.exit_code != '0'
        run: |
          echo "The evaluation exited with code ${{ steps.eval.outputs.exit_code }}: 1 means a metric is below evals/thresholds.json, 2 means it could not run."
          exit 1
